[package]
name = "roon-ai"
version = "3.8.0"  # CI overrides via ROON_AI_VERSION env var from git tag
edition = "2021"
authors = ["RooAI"]
description = "Natural-language Roon control bridge with conversational AI agent and MCP server"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/cfogarty1964/Roon-AI"

[features]
# Default to server for standalone cargo build/test (dx build uses explicit features)
default = ["server"]
server = [
    "dioxus/server",
    "dep:axum",
    "dep:axum-server",
    "dep:rustls",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:roon-api",
    "dep:reqwest",
    "dep:tracing-subscriber",
    "dep:tracing-appender",
    "dep:config",
    "dep:tokio-stream",
    "dep:tokio-util",
    "dep:ssdp-client",
    "dep:gethostname",
    "dep:if-addrs",
    "dep:rcgen",
    "dep:rust-embed",
    "dep:mime_guess",
    "dep:http-body-util",
    "dep:rust-mcp-sdk",
    "dep:pulldown-cmark",
]
web = ["dioxus/web"]

[dependencies]
# Dioxus UI framework (SSR + client hydration + router)
dioxus = { version = "0.7.3", features = ["fullstack", "router"] }

# Serialization (shared)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto/hashing (shared - pure Rust)
md5 = "0.8"
hex = "0.4"
rand = "0.8"

# Regex (shared)
regex = "1"

# URL encoding/parsing (shared)
urlencoding = "2"
url = "2"

# XML parsing (shared)
quick-xml = { version = "0.37", features = ["serialize"] }

# Logging (shared - tracing works in WASM)
tracing = "0.1"

# Error handling (shared)
thiserror = "2"
anyhow = "1"

# Date/time (shared)
chrono = { version = "0.4", features = ["serde"] }

# Async utilities (shared)
futures = "0.3"
async-trait = "0.1"

# Base64 (shared)
base64 = "0.22.1"

# Dioxus UI primitives (shared - needed for SSR and client hydration)
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false, features = ["router"] }

# ============ SERVER-ONLY DEPENDENCIES ============
# These are optional and only included when building for server

# Web framework (server only)
axum = { version = "0.8", features = ["macros"], optional = true }
# HTTPS server backend with rustls (axum::serve has no TLS support).
# Used to serve over HTTPS with a self-signed cert so the browser
# microphone API works from non-localhost origins (mic requires a
# secure context: HTTPS or localhost).
axum-server = { version = "0.7", features = ["tls-rustls"], optional = true }
# Direct rustls dep so we can install a CryptoProvider at startup.
# Without this rustls 0.23+ panics with "no process-level CryptoProvider
# available" when both aws-lc-rs and ring end up in the dep tree (which
# they do via axum-server + its transitive deps).
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace"], optional = true }

# Roon API (server only)
# Vendored from open-horizon-labs/rust-roon-api branch ohc/main with a small
# patch adding `hierarchy: Option<String>` to BrowseOpts/LoadOpts so we can
# use Roon's `now_playing` hierarchy (needed for the Love action menu —
# the standard `browse` hierarchy doesn't expose Love).
# TODO: Upstream the hierarchy patch and switch back to a git dep.
roon-api = { path = "vendor/rust-roon-api", features = ["transport", "image", "status", "browse"], optional = true }

# HTTP client (server only)
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"], optional = true }

# Logging subscriber (server only - needs tokio)
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# Rolling-file log appender (server only)
tracing-appender = { version = "0.2", optional = true }

# Config (server only)
config = { version = "0.15", optional = true }

# Tokio stream utilities (server only)
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
tokio-util = { version = "0.7", optional = true }

# SSDP/UPnP discovery (server only)
ssdp-client = { version = "2", optional = true }
gethostname = { version = "1.1.0", optional = true }

# Network interface enumeration (server only) — used to populate self-signed
# TLS cert SAN entries with the host's LAN IPs so mic works when accessing
# the server over HTTPS from another PC on the network.
if-addrs = { version = "0.13", optional = true }

# Self-signed TLS certificate generation (server only) — generates a long-
# lived cert at first launch, persisted to <data_dir>/certs/ for reuse.
rcgen = { version = "0.13", optional = true }

# Embedded assets for single-binary distribution (server only, ADR 002)
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }
http-body-util = { version = "0.1", optional = true }

# MCP server (server only)
rust-mcp-sdk = { version = "0.8", default-features = false, features = ["server", "macros", "hyper-server", "sse"], optional = true }

# Markdown rendering for AI chat responses (server only)
pulldown-cmark = { version = "0.12", optional = true }

# ============ WINDOWS-ONLY DEPENDENCIES ============
# System tray icon + event loop for headless background operation
[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
tao = "0.34"
image = { version = "0.25", default-features = false, features = ["png"] }
# souvlaki wraps Windows SMTC (System Media Transport Controls) so the
# keyboard's media keys can drive playback in the active zone from any
# foreground app. Cross-platform but currently feature-gated to Windows.
souvlaki = "0.8"

# ============ WEB-ONLY DEPENDENCIES ============
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "DomTokenList", "Storage", "Request", "RequestInit", "Response", "Headers", "EventSource", "MessageEvent"] }
serde-wasm-bindgen = "0.6"
# getrandom needs js feature for WASM (used by rand)
getrandom = { version = "0.2", features = ["js"] }

[[bin]]
name = "roon-ai"
path = "src/main.rs"

[[bin]]
name = "protocol-checker"
path = "src/bin/protocol_checker.rs"
required-features = ["server"]

[dev-dependencies]
tokio-test = "0.4"
serial_test = "3"
syn = { version = "2", features = ["full", "parsing", "visit"] }
walkdir = "2"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Cross-compilation targets for static musl builds
# Build with: cargo build --release --target x86_64-unknown-linux-musl
# Or use cross: cross build --release --target x86_64-unknown-linux-musl
# Available targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, armv7-unknown-linux-musleabihf

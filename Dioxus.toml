[application]
name = "roon-ai"
asset_dir = "public"

[web.app]
title = "Roon AI"

[web.watcher]
reload_html = true
watch_path = ["src", "public"]

[web.resource]
# Stylesheets injected into index.html (ADR 002: single-binary distribution)
style = ["/tailwind.css", "/dx-components-theme.css"]

[web.resource.dev]
base_path = "/"
